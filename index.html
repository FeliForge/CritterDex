<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>CritterDex — Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--bg2:#0d1526;--panel:rgba(22,32,56,.72);--panel-solid:#121c30;--line:rgba(120,160,220,.18);--mint:#5ef0c0;--mint-dim:#2a9d78;--coral:#ff6b8a;--gold:#ffd166;--violet:#a78bfa;--sky:#6ec8ff;--text:#eef3ff;--muted:#8b9bb8;--glow:0 0 40px rgba(94,240,192,.25);--radius:20px;--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
body{display:grid;place-items:center;padding:40px 20px}
.box{max-width:480px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px}
h1{font-size:1.6rem;margin-bottom:12px}p{color:var(--muted);line-height:1.5;margin-bottom:16px}
a{color:var(--mint);font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>CritterDex</h1>
  <p>Faltan archivos en el repo. Sube <code>index.html</code> y renombra <code>app-new.js</code> → <code>app.js</code> en GitHub.</p>
  <p>Archivos listos para descargar desde el chat de Grok.</p>
  <p><a href="https://github.com/FeliForge/CritterDex">Ir al repositorio</a></p>
</div>
</body>
</html>
